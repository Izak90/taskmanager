name: Java CI/CD Pipeline TaskManager API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        run: mvn clean test

      - name: Run integration tests
        run: mvn verify -DskipUnitTests

      # Opcional: Upload relatório de testes
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()  # Upload mesmo se testes falharem
        with:
          name: test-reports-${{ github.ref_name }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkstyle validation
        run: mvn checkstyle:check

  build:
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ github.ref_name }}-${{ github.sha }}
          path: target/*.jar
          retention-days: 30

