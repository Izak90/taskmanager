name: Java CI/CD Pipeline TaskManager API

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests and build
        run: mvn clean verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskmanager-app-jar-${{ github.ref_name }}  # Include branch name in artifact name
          path: target/*.jar